name: Mirror to GitLab

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  to_gitlab:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_WRITE_TOKEN }}
        run: |
          git remote add gitlab https://oauth2:${GITLAB_TOKEN}@gitlab.com/mauricio-delhoyo/Cloud-Resume-Challenge.git
          git push gitlab --all --force
          git push gitlab --tags --force
